<!DOCTYPE html>

<style>
:root{--bg:#08090B;--bg2:#0E1424;--card:#14171F;--gold:#D6B36A;--tx:#F6F4EF;--tx2:#A4A6AD;--red:#7A1F2B;--blue:#12254A;--ln:#262A35;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#14203a,#050608 70%);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}

button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
#app{position:relative;max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--ln)}
.scr{flex:1;min-height:0;display:none;position:relative;overflow:hidden}.scr.on{display:block}
.pg{height:100%;overflow-y:auto;padding:16px}

.ph{position:absolute;top:38%;left:0;right:0;text-align:center;color:var(--tx2);padding:0 30px}.ph b{display:block;font-size:44px;color:var(--gold)}

.fb{border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 10px;font-size:12px;margin-left:8px}.fb.on{border-color:var(--ln);color:var(--tx2)}
.tg{display:inline-block;font-size:12px;color:var(--gold);margin-right:10px}.tg.e{color:var(--tx)}
.act{position:absolute;right:6px;bottom:20px;display:flex;flex-direction:column;gap:12px;align-items:center}

.hr{position:absolute;top:40%;left:50%;font-size:90px;color:var(--gold);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}.hr.pop{animation:pop .7s}

.tt{display:flex;justify-content:center;gap:18px;padding:10px 0 4px;align-items:center}

.rg{display:flex;width:54px;height:54px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--gold),var(--red));align-items:center;justify-content:center;font-size:20px;margin-bottom:2px}.rg.seen{background:var(--ln)}
.rg i{display:flex;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));border:2px solid var(--bg);align-items:center;justify-content:center;font-style:normal}
.tab{display:flex;border-top:1px solid var(--ln);background:var(--bg);padding:4px 0}
.tab button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--tx2);padding:6px 0}.tab button.on{color:var(--gold)}.tab b{font-size:20px;font-weight:400}
.tab .plus b{width:46px;height:32px;border-radius:9px;background:var(--gold);color:#120d02;display:flex;align-items:center;justify-content:center;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tl{aspect-ratio:9/14;background:linear-gradient(165deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:6px;font-size:11px;text-align:left;cursor:pointer}
.chip{display:inline-block;padding:4px 12px;border:1px solid var(--ln);border-radius:99px;font-size:12px;color:var(--tx2);margin:0 6px 6px 0}.chip.on{border-color:var(--gold);color:var(--gold)}
input{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--gold);color:#120d02;border-radius:10px;padding:10px 16px;font-weight:600}.btn.o{background:none;color:var(--tx);border:1px solid var(--ln)}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));border:2px solid var(--gold)}
.pf{text-align:center}.pf .av{width:84px;height:84px;margin:0 auto 8px}.pf h2{margin:0;font-family:'Playfair Display',Georgia,serif}
.sts{display:flex;justify-content:space-around;margin:14px 0}.sts b{display:block;font-size:18px}.sts span{color:var(--tx2);font-size:12px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}#ov.on{display:block}
.sh{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:78vh;overflow-y:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln)}
.sv{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:100%;max-width:480px;background:linear-gradient(165deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:24px;font-family:'Playfair Display',Georgia,serif;padding-top:calc(30px + env(safe-area-inset-top,0px))}
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:2}.bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}.bars i.d{background:#fff}.bars i.a::after{content:"";display:block;height:100%;background:#fff;animation:w 4s linear}
@keyframes w{from{width:0}to{width:100%}}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--card)}.msg.me{margin-left:auto;background:var(--blue)}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;border:1px solid var(--ln);border-radius:10px;padding:8px}.seg .on{border-color:var(--gold);color:var(--gold)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#120d02;padding:8px 16px;border-radius:8px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.s{opacity:1}
small,.mut{color:var(--tx2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hr.pop{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* header, stories space, tab bar, action rail */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#s-home.on{display:flex;flex-direction:column}
.top{position:relative;flex:none;z-index:5;background:linear-gradient(180deg,#0E1424,var(--bg));border-bottom:1px solid rgba(214,179,106,.28);padding-bottom:8px}
.feed{flex:1;min-height:0;height:auto}
.tt{justify-content:space-between;gap:8px;padding:10px 14px 6px}
.tt button{font-size:13px}
.tg2{display:flex;gap:14px}
.brand{display:flex;align-items:center;gap:7px;font-size:15px;letter-spacing:.14em}
.tt .ib{width:36px;height:36px;border:1px solid var(--ln);border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--tx)}

.stw{background:rgba(255,255,255,.025);border-top:1px solid var(--ln);margin-top:4px}
.sth{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;font-size:10px;letter-spacing:.2em;color:var(--tx2)}
.sth button{font-size:11px;letter-spacing:0;color:var(--gold)}
.tab{position:relative;z-index:6;margin:4px 10px 8px;padding:6px 6px 4px;border:1px solid rgba(214,179,106,.25);border-radius:22px;background:rgba(14,20,36,.96);box-shadow:0 10px 30px rgba(0,0,0,.5);align-items:flex-end;gap:2px}
.tab button{position:relative;gap:3px;padding:8px 0 6px;border-radius:14px;font-size:10.5px;letter-spacing:.03em}

.tab .plus{flex:none;width:56px;height:56px;margin:-26px 6px 2px;border-radius:50%;padding:0;align-items:center;justify-content:center;color:#120d02;background:radial-gradient(circle at 35% 30%,#F0DCAE,var(--gold) 55%,#a8823a);box-shadow:0 0 0 4px var(--bg),0 8px 26px rgba(214,179,106,.45)}
.tab .plus .ic{width:28px;height:28px;stroke-width:2.3}

.act{right:8px;bottom:18px;gap:4px;padding:8px 2px;border-radius:26px;background:rgba(8,9,11,.5);backdrop-filter:blur(8px);border:1px solid rgba(214,179,106,.22)}
.act b{display:flex}.act .ic{width:24px;height:24px}
.act .on .ic{fill:var(--gold)}
/* film leader loader */
.loader{--serif:'Fraunces',Georgia,serif;--cream:#F6F4EF;position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#05060A;overflow:hidden;cursor:pointer;transition:opacity .5s ease,visibility 0s linear .5s}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
.film{position:relative;width:min(92vw,720px);aspect-ratio:4/3;max-height:82vh;display:flex;background:#0a0b0e;border-radius:3px;overflow:hidden;opacity:0;transform:scale(.96);box-shadow:0 0 0 1px rgba(214,179,106,.08),0 40px 120px rgba(0,0,0,.9),0 0 140px rgba(214,179,106,.05);animation:gateIn .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes gateIn{0%{opacity:0;transform:scale(.94)}25%{opacity:.4}35%{opacity:.15}50%{opacity:.85}65%{opacity:.4}80%{opacity:1}100%{opacity:1;transform:scale(1)}}
.perfs{flex:0 0 22px;position:relative;background:#1a1109;display:flex;flex-direction:column;gap:6px;padding:8px 0;align-items:center;overflow:hidden;z-index:2}
.perfs-r{box-shadow:inset 1px 0 0 rgba(0,0,0,.5)}.perfs-l{box-shadow:inset -1px 0 0 rgba(0,0,0,.5)}
.perf-hole{width:12px;height:14px;background:#05060A;border-radius:2px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.gate{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(214,179,106,.05),transparent 70%),#07080a;z-index:1}
.weave{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:weave 220ms steps(4) infinite}
@keyframes weave{0%,100%{transform:translate(0,0)}25%{transform:translate(.9px,-.4px)}50%{transform:translate(-.6px,.6px)}75%{transform:translate(.5px,.3px)}}
.frame{position:relative;height:92%;aspect-ratio:1;max-width:92%;display:flex;align-items:center;justify-content:center}
.leader{width:100%;height:100%;display:block;overflow:visible}
#arc{animation:arcDraw 2.9s 400ms linear forwards}
@keyframes arcDraw{from{stroke-dashoffset:540.35}to{stroke-dashoffset:0}}
#hand{animation:handRotate 2.9s 400ms linear forwards}
@keyframes handRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:300;font-size:clamp(72px,16vmin,140px);line-height:1;color:var(--cream);text-shadow:0 0 30px rgba(214,179,106,.55),0 0 70px rgba(214,179,106,.25);pointer-events:none;letter-spacing:-.02em}
.number.pop{animation:numberPop .55s cubic-bezier(.2,.8,.3,1)}
@keyframes numberPop{0%{opacity:0;transform:scale(1.35);filter:blur(4px)}28%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
.brand-top,.brand-bot{position:absolute;left:0;right:0;text-align:center;text-transform:uppercase;pointer-events:none;z-index:2}
.brand-top{top:16px;font-size:9px;letter-spacing:.34em;text-indent:.34em;color:rgba(214,179,106,.55)}
.brand-bot{bottom:16px;font-size:8px;letter-spacing:.42em;text-indent:.42em;color:rgba(246,244,239,.28)}
.dust,.scratches{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.dust-speck{position:absolute;border-radius:50%;background:rgba(240,220,174,.75);box-shadow:0 0 3px rgba(214,179,106,.5);opacity:0;animation:dustFlicker 3s ease-in-out infinite}
@keyframes dustFlicker{0%,100%{opacity:0}25%,60%{opacity:.7}}
.scratch{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.13) 22%,rgba(255,255,255,.13) 78%,transparent 100%);opacity:0;animation:scratchFlicker 4s linear infinite}
@keyframes scratchFlicker{0%,18%,36%,54%,72%,90%,100%{opacity:0}9%,27%,45%,63%,81%{opacity:.55}}
.gate-vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(0,0,0,.7) 100%),linear-gradient(to bottom,rgba(0,0,0,.55),transparent 14%,transparent 86%,rgba(0,0,0,.6))}
.burn{position:absolute;inset:0;pointer-events:none;z-index:20}
.ember{position:absolute;border-radius:50%;filter:blur(40px) contrast(1.18);mix-blend-mode:screen;opacity:0;transform:scale(0)}
.ember-a{width:52vmin;height:52vmin;left:calc(50% - 26vmin);top:calc(50% - 22vmin);background:radial-gradient(circle,#FFF6E0 0%,#FFCC66 10%,#FF8C1A 22%,#C94F0A 40%,#6A1E00 58%,rgba(40,10,0,.3) 72%,transparent 85%)}
.ember-b{width:72vmin;height:72vmin;left:calc(50% - 22vmin);top:calc(50% - 32vmin);background:radial-gradient(circle,#FFF6E0 0%,#FFB84D 12%,#D4550A 32%,rgba(80,20,0,.4) 52%,transparent 72%)}
.loader.burning .ember{opacity:1}
.loader.burning .ember-a{animation:burnA 1s cubic-bezier(.5,0,.6,1) forwards}
.loader.burning .ember-b{animation:burnB 1.1s .04s cubic-bezier(.5,0,.6,1) forwards}
@keyframes burnA{0%{transform:scale(0) rotate(0)}100%{transform:scale(3.6) rotate(22deg)}}
@keyframes burnB{0%{transform:scale(0) rotate(0)}100%{transform:scale(3.1) rotate(-26deg)}}
.white-out{position:absolute;inset:0;background:radial-gradient(circle at 48% 52%,#FFF6E0 0%,#FFE6B0 50%,#F0DCAE 100%);opacity:0;z-index:5;pointer-events:none}
.loader.burning .white-out{animation:whitePeak .6s .4s ease-in forwards}
@keyframes whitePeak{0%{opacity:0}60%,100%{opacity:1}}
.hint{position:absolute;left:0;right:0;bottom:22px;z-index:4;text-align:center;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:rgba(154,157,166,.3);pointer-events:none;opacity:0;animation:fadeUp .9s 1.6s ease forwards}
@keyframes fadeUp{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.film,.weave,.number,.hint,.dust-speck,.scratch,#arc,#hand{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
@media(max-width:520px){.perfs{flex:0 0 18px;gap:5px}.perf-hole{width:10px;height:12px}.brand-top{font-size:8px;letter-spacing:.28em}.brand-bot{font-size:7px;letter-spacing:.36em}.number{font-size:clamp(64px,18vmin,120px)}.hint{bottom:16px;font-size:8px}}

const go=t=>location.hash=='#'+t?show(t):location.hash=t,ov=h=>{$('#ov').innerHTML=h;$('#ov').className='on'},cls=()=>{clearTimeout(stT);$('#ov').className='';$('#ov').innerHTML=''};
function create(){const c=tgt&&all().find(x=>x.id==tgt);ov(`<div class="sh"><h3 style="margin:0 0 6px">Create</h3><div class="seg"><button class="${mode=='short'?'on':''}" data-a="md" data-v="short">Short</button><button class="${mode=='story'?'on':''}" data-a="md" data-v="story">Story</button>${c?`<button class="${mode=='echo'?'on':''}" data-a="md" data-v="echo">Echo</button>`:''}</div>
<p class="mut">${mode=='echo'?'Reply to “'+c.t+'” with your own clip. It joins the echo thread.':mode=='story'?'A Story is a quick moment for your ring.':'A Short is a full-screen clip in the feed.'}</p>
<input id="ct" placeholder="Caption or text" aria-label="Caption">${mode=='short'?`<div style="margin-top:10px">${SK.map(k=>`<button class="chip ${cat==k?'on':''}" data-a="cat" data-v="${k}">${k}</button>`).join('')}<button class="chip ${pp?'on':''}" data-a="ppt">★ Add to Passport</button></div>`:''}<div class="row" style="display:flex;gap:8px;margin-top:10px"><button class="btn o" data-a="rec">Record or upload</button><button class="btn" data-a="post">Post</button></div><small>Camera and upload are simulated in this prototype.</small></div>`)}
function comments(id){const mine=(S.cm[id]||[]).map((x,i)=>({...(typeof x=='string'?{t:x}:x),u:S.name,k:id+':m'+i,m:1,i})).reverse(),samp=CM.map((t,i)=>({t,u:U[i].n,k:id+':s'+i,ts:['2h','1h','35m'][i]})),a=[...mine,...samp];
ov(`<div class="sh"><div class="row2"><h3 style="margin:0">Comments · ${a.length}</h3><button data-a="x" aria-label="Close">✕</button></div><div class="rx">${['🔥','👏','😂','❤️','🎭'].map(e=>`<button data-a="cx" data-v="${e}">${e}</button>`).join('')}</div>
<div class="cmb">${a.map(x=>`<div class="cmt"><span class="av s" style="${col(x.m?uu('me'):U.find(u=>u.n==x.u)||U[0])}"></span><div class="cb"><b>@${x.u}</b> <small>${x.ts||'now'}</small><p>${x.t}</p><div class="cr"><button data-a="rpl" data-v="${x.u}">Reply</button>${x.m?`<button data-a="dc" data-v="${id}|${x.i}">Delete</button>`:''}</div></div><button class="clk ${S.cl[x.k]?'on':''}" data-a="clk" data-v="${id}|${x.k}" aria-label="Like comment">${ic('like')}</button></div>`).join('')}</div>
<div class="cin"><input id="ct" placeholder="Add a comment…" aria-label="Comment" maxlength="200"><button class="btn" data-a="cs" data-v="${id}">Send</button></div></div>`)}
function chat(id){const u=uu(id),m=S.msgs[id]||[];ov(`<div class="sh"><h3 style="margin:0 0 8px">@${u.n}</h3>${m.length?m.map(x=>`<div class="msg me">${x.t}</div>`).join(''):'<p class="mut">No messages yet.</p>'}<div style="display:flex;gap:8px;margin-top:10px"><input id="ct" placeholder="Message" aria-label="Message"><button class="btn" data-a="ms" data-v="${id}">Send</button></div><small>Local demo: messages stay in this browser.</small></div>`)}
function story(id,i=0){const L=id=='me'?S.st:STR,u=uu(id);clearTimeout(stT);if(i>=L.length){S.seen[id]=1;save();cls();stories();return}if(i<0)i=0;
ov(`<div class="sv" style="${col(u)}" data-a="sn" data-v="${id}|${i}"><div class="bars">${L.map((_,j)=>`<i class="${j<i?'d':j==i?'a':''}"></i>`).join('')}</div><span style="position:absolute;top:calc(26px + env(safe-area-inset-top,0px));left:14px;font:600 13px Inter">@${u.n}</span><button data-a="x" style="position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:14px;font-size:22px" aria-label="Close">✕</button>${L[i]}</div>`);stT=setTimeout(()=>story(id,i+1),4000)}
const F={go,act:()=>{it='act';go('inbox')},msgs:()=>{it='msg';go('inbox')},rpl:v=>{const i=$('#ct');i.value='@'+v+' ';i.focus()},cx:v=>{const i=$('#ct');i.value+=v;i.focus()},clk:v=>{const[id,k]=v.split('|');S.cl[k]=!S.cl[k];comments(id)},dc:v=>{const[id,i]=v.split('|');S.cm[id].splice(+i,1);comments(id);sync()},
rp:()=>ov(`<div class="sh"><div class="row2"><h3 style="margin:0">Report this clip</h3><button data-a="x" aria-label="Close">✕</button></div><p class="mut">Why are you reporting it?</p>${['Spam or fake casting call','Harassment or hate','Inappropriate content','Impersonation'].map(r=>`<button class="li" data-a="rps">${r}</button>`).join('')}</div>`),rps:()=>{cls();toast('Report sent to moderation (simulated)')},
lab:()=>{tgt='';mode='short';cat='Drama';pp=0;create();$('#ct').value='#SceneLab The unsaid'},apl:v=>{if(S.ap[v])return toast('Already applied: see Inbox, Auditions');S.ap[v]={st:0};toast('Application submitted (simulated)');show('disc')},
adv:v=>{const a=S.ap[v];if(a.st<5)a.st++;toast('Status: '+AST[a.st]+' (simulated)');show('inbox')},sk:v=>{S.sk=S.sk.includes(v)?S.sk.filter(x=>x!=v):[...S.sk,v];show('me')},pub:()=>{S.pub=!S.pub;show('me')},
cat:v=>{cat=v;const t=$('#ct').value;create();$('#ct').value=t},ppt:()=>{pp=pp?0:1;const t=$('#ct').value;create();$('#ct').value=t},srch:()=>{q='';go('disc');setTimeout(()=>{const i=$('#q');i&&i.focus()},80)},sa:()=>{const u=U.find(x=>!S.seen[x.id]);u?story(u.id):toast('You’re all caught up')},top:v=>{top=v;home()},f:v=>{S.f[v]=!S.f[v];toast(S.f[v]?'Following @'+uu(v).n:'Unfollowed');sync()},l:v=>{S.l[v]=!S.l[v];sync()},s:v=>{S.s[v]=!S.s[v];toast(S.s[v]?'Saved to your profile':'Removed');sync()},
sh:()=>toast('Share link copied (simulated)'),cmt:comments,ech:v=>{tgt=v;mode='echo';create()},new:()=>{tgt='';mode='short';pp=0;create()},md:v=>{mode=v;create()},rec:()=>toast('Camera and upload are coming soon (simulated)'),
post:()=>{const t=$('#ct').value.trim()||'Untitled moment';if(mode=='story')S.st.push(t);else if(mode=='echo'){(S.ec[tgt]=S.ec[tgt]||[]).push({t});const h=document.querySelector(`[data-id="${tgt}"] .hs`);h&&(h.insertAdjacentHTML('beforeend',esl('me',t)),dots(h))}else S.posts.unshift({id:'p'+Date.now(),t,topic:cat,pp:pp?1:0,b:0});
cls();toast(mode=='echo'?'Echo added: swipe the clip to see it':mode=='story'?'Story posted':'Short posted');if(mode=='short'){top='fy';go('home');home()}else{stories();sync()}},
cs:v=>{const t=$('#ct').value.trim();if(!t)return;(S.cm[v]=S.cm[v]||[]).push({t,ts:'now'});comments(v);sync()},ms:v=>{const t=$('#ct').value.trim();if(!t)return;(S.msgs[v]=S.msgs[v]||[]).push({t});chat(v)},chat,
sto:v=>{if(v=='me'&&!S.st.length){tgt='';mode='story';create()}else story(v)},sn:v=>{const[id,i]=v.split('|');story(id,+i+(F.sn.x<innerWidth/3?-1:1))},x:cls,
gf:v=>{foc=v;top='fy';location.hash=='#home'?(show('home'),home()):location.hash='home'},qs:v=>{q=q==v?'':v;show('disc')},it:v=>{it=v;show('inbox')},pt:v=>{pt=v;show('me')},bio:()=>{S.bio=$('#bi').value||S.bio;show('me')}};
document.addEventListener('click',e=>{F.sn.x=e.clientX;if(e.target.id=='ov')return cls();const t=e.target.closest('[data-a]');
if(!t){const s=e.target.closest('.sl');if(s&&s.querySelector('.hr')){const n=Date.now();if(n-(s._t||0)<320){const id=s.closest('.cl').dataset.id,h=s.querySelector('.hr');if(!S.l[id]){S.l[id]=1;sync()}h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop')}s._t=n}return}
if(t.dataset.a=='x'){e.stopPropagation();return cls()}(F[t.dataset.a]||(()=>{}))(t.dataset.v);save()});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;const p=e.target.selectionStart;show('disc');const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('scroll',e=>{const h=e.target;h.classList&&h.classList.contains('hs')&&dots(h)},true);
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ct'){const b=document.querySelector('#ov [data-a="cs"],#ov [data-a="ms"],#ov [data-a="post"]');b&&b.click()}});
$('#feed').addEventListener('scroll',e=>$('#stp').classList.toggle('h',e.target.scrollTop>40),{passive:true});
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'home';show(V[h]||h=='home'?h:'home');if(h=='home')home()});
home();show('home');
})();
</script></body></html>
